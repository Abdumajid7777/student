{% extends "base.html" %}

{% block content %}

<div class="container" style="background:#111827; margin: 40px auto; max-width: 600px; color: #ffffff; padding: 24px; border-radius: 12px;">

    <h3 style="color: #fbbf24; margin-bottom: 20px; text-align: center;">Добавить студента</h3>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="margin-bottom: 16px;">
            <label for="avatar" style="color: #fbbf24; font-weight: 600;">Аватарка</label>
            <input style="background-color: #1f2937; color: #ffffff; border: 1px solid #374151; width: 100%; padding: 8px; border-radius: 6px; margin-top: 4px;" name="avatar" type="file" id="avatar" accept="image/*">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="first_name" style="color: #fbbf24; font-weight: 600;">Имя</label>
            <input style="background-color: #1f2937; color: #ffffff; border: 1px solid #374151; width: 100%; padding: 8px; border-radius: 6px; margin-top: 4px;" name="first_name" type="text" id="first_name" required>
        </div>

        <div style="margin-bottom: 16px;">
            <label for="last_name" style="color: #fbbf24; font-weight: 600;">Фамилия</label>
            <input style="background-color: #1f2937; color: #ffffff; border: 1px solid #374151; width: 100%; padding: 8px; border-radius: 6px; margin-top: 4px;" name="last_name" type="text" id="last_name">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="age" style="color: #fbbf24; font-weight: 600;">Возраст</label>
            <input style="background-color: #1f2937; color: #ffffff; border: 1px solid #374151; width: 100%; padding: 8px; border-radius: 6px; margin-top: 4px;" name="age" type="number" id="age">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="phone_numbers" style="color: #fbbf24; font-weight: 600;">Номер телефона</label>
            <input style="background-color: #1f2937; color: #ffffff; border: 1px solid #374151; width: 100%; padding: 8px; border-radius: 6px; margin-top: 4px;" name="phone_numbers" type="text" id="phone_numbers" required>
        </div>

        <div style="margin-bottom: 16px;">
            <label for="parent_phone_numbers" style="color: #fbbf24; font-weight: 600;">Номер телефона родителей</label>
            <input style="background-color: #1f2937; color: #ffffff; border: 1px solid #374151; width: 100%; padding: 8px; border-radius: 6px; margin-top: 4px;" name="parent_phone_numbers" type="text" id="parent_phone_numbers">
        </div>

        <div style="margin-bottom: 24px;">
            <label for="group" style="color: #fbbf24; font-weight: 600;">Группа</label>
            <select name="group" id="group" required style="background-color: #1f2937; color: #ffffff; border: 1px solid #374151; width: 100%; padding: 8px; border-radius: 6px; margin-top: 4px;">
                <option value="" disabled selected>Выберите группу</option>
                {% for group in groups %}
                    <option value="{{ group.id }}">{{ group.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="text-align: center; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'index' %}" class="btn btn-warning">Назад</a>
        </div>

    </form> 
</div>

{% endblock %}
