{% load static%}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
</head>

<body>
<header>
    <nav style="background-color: #1f2937; padding: 12px 24px; border-bottom: 1px solid #374151;">
        <div style="display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto;">
            
            <a href="{% url 'index' %}" style="color: #fbbf24; font-weight: bold; text-decoration: none; font-size: 18px;">
                Студенты
            </a>

            <ul style="display: flex; list-style: none; gap: 20px; margin: 0; padding: 0;">
                <li>
                    <a href="{% url 'index' %}" style="color: #ffffff; text-decoration: none;">Главная</a>
                </li>
                <li>
                    <a href="{% url 'group_index' %}" style="color: #fff; text-decoration: none;">Группы</a>
                </li>
                <li>
                    <a href="{% url 'student_index' %}" style="color: #fff; text-decoration: none;">Студенты</a>
                </li>
                <li>
                    <a href="{% url 'teacher_index' %}" style="color: #fff; text-decoration: none;">Учителя</a>
                </li>
                <li>
                    <a href="{% url 'mark_index' %}" style="color: #fff; text-decoration: none;">Одценкий</a>
                </li>
            </ul>   

            <form method="GET" style="display: flex; gap: 6px;">
                <input type="text" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Поиск..." style="background-color: #374151; color: #ffffff; border: 1px solid #4b5563; padding: 6px 12px; border-radius: 6px; outline: none;">
                <button type="submit" style="background-color: #fbbf24; color: #000000; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                    Найти
                </button>
            </form>

        </div>
    </nav>
</header>

    {% block content %}

    {% endblock %}

</body>

</html>
