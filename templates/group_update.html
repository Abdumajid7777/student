{% extends 'base.html' %}

{% block content %}
<div style="max-width: 550px; margin: 40px auto; background-color: #111827; padding: 30px; border-radius: 12px; border: 2px solid #385389; color: white;">
    <h2 style="margin-top: 0; color: #fbbf24;">Изменить группу</h2>

    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Название группы:</label>
            <input type="text" name="name" value="{{ group.name }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: white;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Курс:</label>
            <input type="text" name="course" value="{{ group.course }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: white;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Дата начала:</label>
            <input type="date" name="start_date" value="{{ group.start_date|date:'Y-m-d' }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: white;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Дата окончания:</label>
            <input type="date" name="end_date" value="{{ group.end_date|date:'Y-m-d' }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: white;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Количество учеников:</label>
            <input type="number" name="student_count" value="{{ group.student_count }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: white;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Контракт:</label>
            <input type="text" name="contract" value="{{ group.contract }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: white;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">Преподаватель (Ментор):</label>
            <select name="mentor" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: white;">
                <option value="">-- Выберите ментора --</option>
                {% for teacher in teachers %}
                    <option value="{{ teacher.id }}" {% if group.mentor_id == teacher.id %}selected{% endif %}>
                        {{ teacher }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" style="background-color: #ffcc00; color: #92400e; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Изменить</button>
        <a href="{% url 'group_index' %}" style="background-color: #4b5563; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; margin-left: 10px; display: inline-block;">Отмена</a>
    </form>
</div>
{% endblock %}
