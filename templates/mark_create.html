{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; background-color: #111827; padding: 30px; border-radius: 12px; border: 2px solid #385389; color: white;">
    <h2 style="margin-top: 0; color: #3b82f6;">Поставить оценку</h2>

    <form method="POST">
        {% csrf_token %}
        
        <label for="student" style="color: #fff; display: block; margin-bottom: 8px;">Студент:</label>
        <select name="student" id="student" style="width: 100%; padding: 10px; background-color: #1f2937; color: #ffffff; border: 1px solid #374151; border-radius: 6px; outline: none; margin-bottom: 16px;">
            <option value="" disabled selected>Выберите студента...</option>
            
            {% for student in students %}
                <option value="{{ student.id }}">
                    {{ student.first_name }} {{ student.last_name }}
                </option>
            {% empty %}
                <option value="" disabled>Студенты не найдены (База пуста)</option>
            {% endfor %}
        </select>

        <label for="mark" style="color: #fff; display: block; margin-bottom: 8px;">Оценка:</label>
        <input type="number" name="mark" id="mark" placeholder="Введите оценку" style="width: 100%; padding: 10px; background-color: #1f2937; color: #ffffff; border: 1px solid #374151; border-radius: 6px; outline: none; margin-bottom: 20px;">

        <div style="display: flex; gap: 10px;">
            <button type="submit" style="background-color: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Сохранить
            </button>
            <a href="{% url 'mark_index' %}" style="background-color: #4b5563; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold;">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
